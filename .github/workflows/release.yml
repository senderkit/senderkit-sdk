name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Pinned to npm 11: Trusted Publishing needs npm >= 11.5.1, but npm 12
      # hard-errors (EUNKNOWNCONFIG) on the pnpm-only --no-git-checks flag that
      # changesets passes to `pnpm publish` and pnpm 10 forwards verbatim to
      # `npm publish`; npm 11 only warns. Revisit once we're on pnpm >= 11,
      # which publishes via libnpmpublish and spawns no npm at all.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - run: pnpm build

      - run: pnpm test

      - run: pnpm -r typecheck

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in @senderkit/sdk @senderkit/cli @senderkit/react-email; do
            echo "Verifying $pkg..."
            for attempt in 1 2 3 4 5 6; do
              if npm view "$pkg" --json > /tmp/pkg.json 2>/dev/null; then
                break
              fi
              echo "  Attempt $attempt: not yet visible, retrying in 15s..."
              sleep 15
            done
            jq -e --arg pkg "$pkg" \
              '.dist.signatures // error("No provenance signatures for " + $pkg)' \
              /tmp/pkg.json
          done
