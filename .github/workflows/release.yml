name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # No npm upgrade step needed: pnpm >= 11 publishes via libnpmpublish
      # with native OIDC Trusted Publishing — npm is only used by changesets
      # for read-only `npm info` calls, which the runner's default npm handles.

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - run: pnpm build

      - run: pnpm test

      - run: pnpm -r typecheck

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # changesets/action v2 renamed `version`/`publish` to
        # `version-script`/`publish-script` and reads the token from the
        # `github-token` input (defaults to the workflow's GITHUB_TOKEN).
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in @senderkit/sdk @senderkit/cli @senderkit/react-email; do
            echo "Verifying $pkg..."
            for attempt in 1 2 3 4 5 6; do
              if npm view "$pkg" --json > /tmp/pkg.json 2>/dev/null; then
                break
              fi
              echo "  Attempt $attempt: not yet visible, retrying in 15s..."
              sleep 15
            done
            jq -e --arg pkg "$pkg" \
              '.dist.signatures // error("No provenance signatures for " + $pkg)' \
              /tmp/pkg.json
          done
