name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - run: pnpm build

      - run: pnpm test

      - run: pnpm -r typecheck

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in @senderkit/sdk @senderkit/cli @senderkit/react-email; do
            echo "Verifying $pkg..."
            for attempt in 1 2 3 4 5 6; do
              if npm view "$pkg" --json > /tmp/pkg.json 2>/dev/null; then
                break
              fi
              echo "  Attempt $attempt: not yet visible, retrying in 15s..."
              sleep 15
            done
            jq -e --arg pkg "$pkg" \
              '.dist.signatures // error("No provenance signatures for " + $pkg)' \
              /tmp/pkg.json
          done
