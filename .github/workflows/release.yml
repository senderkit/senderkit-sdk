name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - run: pnpm build

      - run: pnpm test

      - run: pnpm -r typecheck

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in @senderkit/sdk @senderkit/cli @senderkit/react-email; do
            echo "Verifying $pkg..."
            for attempt in 1 2 3 4 5 6; do
              if npm view "$pkg" --json > /tmp/pkg.json 2>/dev/null; then
                break
              fi
              echo "  Attempt $attempt: not yet visible, retrying in 15s..."
              sleep 15
            done
            jq -e --arg pkg "$pkg" \
              '.dist.signatures // error("No provenance signatures for " + $pkg)' \
              /tmp/pkg.json
          done
