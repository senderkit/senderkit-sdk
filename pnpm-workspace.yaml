packages:
  - "packages/*"
  - "examples/*"

allowBuilds:
  # matches pnpm 10 behavior: esbuild's install script was ignored and the
  # platform binary comes from its optional-dependency packages instead
  esbuild: false

overrides:
  postcss: ">=8.5.18 <9"
  esbuild: ">=0.28.1"
  hono: ">=4.12.34 <5"
  "@hono/node-server": ">=2.0.5 <3"
  js-yaml: ">=4.3.0 <5"
  fast-uri: ">=3.1.5 <4"
  sharp: ">=0.35.0 <0.36"
  body-parser: ">=2.3.0 <3"
  read-yaml-file: "^2.1.0"
